name: fake_bank
version: 0.1.0
description: A bank account that only writes down its transfers, for tests of the payment tier (always asks, monthly budget).
credentials: []
config:
  iban: the account
reads:
  - name: balance
    description: Current balance
    trust: owner
    private: true
    params: {type: object, additionalProperties: false}
tools:
  - name: prepare_transfer
    description: A transfer. Always needs approval in the owner app.
    tier: payment
    amount_field: amount
    destinations:
      - {field: iban, kind: iban}
    params:
      type: object
      properties:
        iban: {type: string, pattern: "^[A-Za-z]{2}[0-9]{2}[A-Za-z0-9 ]{11,32}$"}
        name: {type: string, minLength: 1, maxLength: 70}
        amount: {type: number, exclusiveMinimum: 0, maximum: 100000}
        reference: {type: string, maxLength: 140}
      required: [iban, name, amount]
      additionalProperties: false
