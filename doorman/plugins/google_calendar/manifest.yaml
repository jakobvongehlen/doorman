name: google_calendar
version: 0.2.0
description: >-
  Google Calendar through the Calendar API. Changes on your own calendars without other attendees run
  right away and can be undone; anything that notifies attendees or touches a shared calendar is a send
  and needs your approval.
credentials: [client_secret, refresh_token]   # refresh_token comes from the login (app: Plugins → Connect)
network: [www.googleapis.com, oauth2.googleapis.com]
agenda: events       # what Doorman's agenda over every calendar (doorman agenda) asks this plugin
# doorman search: every event series of the window (search_past_months back, 12 months ahead), one item per
# series; the events read's switch gates them
index: {read: events, kinds: [event], every_minutes: 30, security_senders: false}
agent_settings: [calendars, default_calendar, timezone, soon_minutes]   # what agents may change (doorman.configure); the rest is the owner's
agent_narrow: [calendars]   # agents may keep fewer of these, never add or clear them (they keep calendars away from agents)
agent_install: true      # agents may set one up (doorman.install); it starts switched off
config:
  client_id: OAuth client ID of a "Desktop app" client in your Google Cloud project
  calendars: calendar IDs to use (default all you can see; "primary" is your main calendar)
  default_calendar: calendar for new events (default primary)
  owner_emails: your own addresses; other attendees count as outside (your Google address is added automatically)
  shared_calendars: calendar IDs to treat as shared even if their sharing settings don't say so
  timezone: IANA zone for times without an offset, e.g. Europe/Berlin (default the calendar's zone)
  soon_minutes: an entry starting within this many minutes is an event_soon for agents (default 30)
  search_past_months: how far back doorman search finds events (default 24; 12 months ahead)
  redirect_port: "port Google sends the sign-in back to on this machine (default 8799)"
login: oauth                     # the owner app shows Connect / Disconnect for this plugin
# Shown in the owner app as numbered steps. [text](https://…) is a link, `x` is code.
setup:
  - >-
    In the [Google Cloud console](https://console.cloud.google.com/projectcreate), signed in with the
    Google account whose calendar the agent should use, create a project, e.g. `doorman`.
  - >-
    Turn on the [Google Calendar API](https://console.cloud.google.com/apis/library/calendar-json.googleapis.com)
    for that project: **Enable**.
  - >-
    [Google Auth Platform → Branding](https://console.cloud.google.com/auth/branding): **Get started**,
    app name `doorman`, your address as support and contact address. Audience: **External**.
  - >-
    [Audience](https://console.cloud.google.com/auth/audience): **Publish app**, so it says
    *In production*. Left in *Testing*, Google ends the login after 7 days. You don't need Google's
    verification for your own use.
  - >-
    [Clients](https://console.cloud.google.com/auth/clients) → **Create client**, type **Desktop app**,
    any name → **Create**. Copy the client ID and the client secret right away: Google shows the secret
    only once (or download the JSON).
  - >-
    Put the client ID into `client_id`, your zone into `timezone` (e.g. `Europe/Berlin`) and the client
    secret into `client_secret`: in the form below when you add the plugin, or later under **Settings and
    credentials** on its card.
  - >-
    On the plugin's card: **Connect account → Open Google sign-in**. Pick the account. Google warns
    that it hasn't verified the app: **Advanced → Go to doorman**, then allow all three permissions.
  - >-
    Google sends you to `http://127.0.0.1:8799/…`, which doesn't load. Copy that page's whole address,
    paste it into the field under **Open Google sign-in** and tap **Finish**.
reads:
  - name: calendars
    description: Calendars with id, name, your access role and whether others can see it (shared)
    trust: owner
    params: {type: object, additionalProperties: false}
  - name: events
    description: >-
      Events between start and end (ISO dates or date-times). Recurring events come as single
      occurrences; their id changes only that occurrence.
    trust: third_party
    # IDs and the link to them, not text: a secondary calendar's 64-character ID and the base64 link alone
    # score as an injection. (An app that makes an event may pick its id, from a-v and 0-9 only, no spaces.)
    # The organizer stays scanned: on an invitation anyone picks that address.
    not_scanned: [id, calendar, recurring_event_id, link]
    params:
      type: object
      properties:
        start: {type: string}
        end: {type: string}
        calendar: {type: string}
        query: {type: string, description: "free-text search in title, description, place and attendees"}
      required: [start, end]
      additionalProperties: false
tools:
  - name: create_event
    description: Create an event. With outside attendees or on a shared calendar it's a send and needs approval.
    tier: reversible
    can_send: with guests other than you, or on a shared calendar   # then a send: that call asks, even on Auto
    destinations:
      - {field: attendees, kind: email}
    params:
      type: object
      properties:
        calendar: {type: string}
        summary: {type: string, minLength: 1}
        start: {type: string}
        end: {type: string}
        location: {type: string}
        description: {type: string}
        attendees: {type: array, items: {type: string, format: email}}
      required: [summary, start, end]
      additionalProperties: false
  - name: update_event
    description: Change an event's time, title, place, description or attendees
    tier: reversible
    can_send: with guests other than you, or on a shared calendar   # then a send: that call asks, even on Auto
    destinations:
      - {field: changes.attendees, kind: email}
    params:
      type: object
      properties:
        calendar: {type: string}
        id: {type: string}
        changes:
          type: object
          properties:
            summary: {type: string, minLength: 1}
            start: {type: string}
            end: {type: string}
            location: {type: string}
            description: {type: string}
            attendees: {type: array, items: {type: string, format: email}}
          additionalProperties: false
          minProperties: 1
      required: [id, changes]
      additionalProperties: false
  - name: delete_event
    description: Delete an event (with outside attendees, they get a cancellation)
    tier: reversible
    can_send: with guests other than you, on a shared calendar, or on an invitation (declines it)   # then a send: that call asks, even on Auto
    params:
      type: object
      properties:
        calendar: {type: string}
        id: {type: string}
      required: [id]
      additionalProperties: false
  - name: respond
    description: >-
      Answer an invitation (an event someone else organizes, with you as a guest): accept, decline or
      tentative, with an optional comment for the organizer. Google tells the organizer. An occurrence's id
      answers that occurrence only; the series' id (recurring_event_id) answers all of them.
    tier: irreversible
    destinations:
      - {field: to, kind: email}   # the organizer, filled in from the event
    editable: [comment]
    params:
      type: object
      properties:
        calendar: {type: string}
        id: {type: string}
        response: {type: string, enum: [accept, decline, tentative]}
        comment: {type: string, maxLength: 1000}
      required: [id, response]
      additionalProperties: false
events:
  - name: invite_received
    description: Someone else invited you to an event (a series counts once)
    fields: [from, summary, start]
  - name: event_soon
    description: An entry starts within soon_minutes (default 30); once per occurrence
    fields: [summary, start, end, location, calendar, minutes]
